    stroke="#0f2b5c"
    stroke-width="4"
  />
  <path d="M 115 185 Q 155 175 190 200 L 190 235 Q 155 210 115 222 Z" fill="#0f2b5c" opacity="0.1" />
  <path d="M 285 185 Q 245 175 210 200 L 210 235 Q 245 210 285 222 Z" fill="#0f2b5c" opacity="0.1" />

  <!-- Center Pencil -->
  <rect x="193" y="135" width="14" height="65" fill="#0f2b5c" stroke="#ffffff" stroke-width="2" />
  <line x1="200" y1="135" x2="200" y2="200" stroke="#facc15" stroke-width="2.5" />
  <polygon points="193,135 207,135 200,105" fill="#facc15" stroke="#ffffff" stroke-width="1.5" />
  <polygon points="197,117 203,117 200,105" fill="#0f2b5c" />

  <!-- Central Ribbon -->
  <path
