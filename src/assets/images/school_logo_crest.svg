  <text
    x="200"
    y="323"
    fill="#0f2b5c"
    font-size="14"
    font-style="italic"
    font-weight="700"
    font-family="Georgia, serif"
    text-anchor="middle"
  >
    We learn for our
  </text>
  <text
    x="200"
    y="341"
    fill="#0f2b5c"
    font-size="16"
    font-style="italic"
    font-weight="800"
    font-family="Georgia, serif"
    text-anchor="middle"
  >
    better future
  </text>
</svg>
